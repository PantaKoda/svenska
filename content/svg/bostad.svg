<?xml version="1.0" encoding="UTF-8"?>
<!-- Scene for the theme pack "bostad": a flat seen from the side, four rooms.
     Placeholder drawing: redraw freely in Inkscape, but keep one group per word with the
     id w-<lemma> (å, ä → a; ö → o). The rooms are word elements too; a thing in a room
     wins over the room because it is smaller. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect x="0" y="0" width="800" height="500" fill="#e8eef1"/>
  <!-- outer walls -->
  <rect x="30" y="30" width="740" height="440" fill="#546e7a"/>

  <!-- rooms: wall and floor -->
  <g id="w-sovrum">
    <rect x="40" y="40" width="355" height="205" fill="#e1e8f5"/>
    <rect x="40" y="225" width="355" height="20" fill="#b9a38a"/>
  </g>
  <g id="w-badrum">
    <rect x="405" y="40" width="355" height="205" fill="#d9f0ee"/>
    <rect x="405" y="225" width="355" height="20" fill="#9fb8b5"/>
    <!-- toilet and basin: part of the room, not words of their own -->
    <rect x="640" y="150" width="46" height="34" rx="4" fill="#ffffff" stroke="#78909c" stroke-width="2"/>
    <path d="M636 184 h54 q0 40 -27 40 q-27 0 -27 -40z" fill="#ffffff" stroke="#78909c" stroke-width="2"/>
    <rect x="470" y="150" width="90" height="16" rx="6" fill="#ffffff" stroke="#78909c" stroke-width="2"/>
    <rect x="508" y="166" width="14" height="59" fill="#cfd8dc"/>
    <rect x="482" y="70" width="66" height="60" fill="#b3e5fc" stroke="#78909c" stroke-width="2"/>
  </g>
  <g id="w-kok">
    <rect x="40" y="255" width="355" height="205" fill="#fdf1d6"/>
    <rect x="40" y="440" width="355" height="20" fill="#b9a38a"/>
  </g>
  <g id="w-vardagsrum">
    <rect x="405" y="255" width="355" height="205" fill="#f3e3e0"/>
    <rect x="405" y="440" width="355" height="20" fill="#b9a38a"/>
  </g>

  <!-- bedroom -->
  <g id="w-sang">
    <rect x="70" y="150" width="20" height="75" fill="#6d4c41"/>
    <rect x="90" y="185" width="170" height="28" fill="#90caf9" stroke="#1565c0" stroke-width="2"/>
    <rect x="96" y="170" width="46" height="18" rx="6" fill="#ffffff" stroke="#90a4ae" stroke-width="2"/>
    <rect x="254" y="185" width="12" height="40" fill="#6d4c41"/>
    <rect x="90" y="213" width="170" height="8" fill="#6d4c41"/>
  </g>
  <g id="w-dorr">
    <rect x="310" y="95" width="62" height="130" fill="#a1887f" stroke="#5d4037" stroke-width="3"/>
    <circle cx="360" cy="165" r="5" fill="#ffd54f"/>
  </g>

  <!-- kitchen -->
  <g id="w-kylskap">
    <rect x="60" y="300" width="70" height="140" rx="4" fill="#eceff1" stroke="#78909c" stroke-width="3"/>
    <line x1="60" y1="350" x2="130" y2="350" stroke="#78909c" stroke-width="3"/>
    <rect x="118" y="318" width="5" height="22" fill="#78909c"/>
    <rect x="118" y="362" width="5" height="34" fill="#78909c"/>
  </g>
  <g id="w-bord">
    <rect x="180" y="372" width="120" height="12" fill="#8d6e63"/>
    <rect x="190" y="384" width="10" height="56" fill="#8d6e63"/>
    <rect x="280" y="384" width="10" height="56" fill="#8d6e63"/>
  </g>
  <g id="w-stol">
    <rect x="322" y="346" width="10" height="94" fill="#c0792a"/>
    <rect x="322" y="392" width="48" height="10" fill="#c0792a"/>
    <rect x="360" y="402" width="10" height="38" fill="#c0792a"/>
  </g>

  <!-- living room -->
  <g id="w-fonster">
    <rect x="440" y="285" width="110" height="80" fill="#b3e5fc" stroke="#546e7a" stroke-width="4"/>
    <line x1="495" y1="285" x2="495" y2="365" stroke="#546e7a" stroke-width="3"/>
    <line x1="440" y1="325" x2="550" y2="325" stroke="#546e7a" stroke-width="3"/>
  </g>
  <g id="w-soffa">
    <rect x="440" y="392" width="190" height="40" rx="8" fill="#7e57c2"/>
    <rect x="432" y="380" width="24" height="56" rx="8" fill="#5e35b1"/>
    <rect x="614" y="380" width="24" height="56" rx="8" fill="#5e35b1"/>
    <rect x="456" y="368" width="158" height="30" rx="8" fill="#9575cd"/>
  </g>
  <g id="w-lampa">
    <polygon points="672,300 728,300 716,340 684,340" fill="#ffe082" stroke="#ffa000" stroke-width="2"/>
    <rect x="697" y="340" width="6" height="92" fill="#757575"/>
    <rect x="680" y="430" width="40" height="8" rx="3" fill="#757575"/>
  </g>
</svg>
