theme: resa
title: "Buss & tåg"
# Getting around: bus, tram and train, tickets and times.
words:
  # vehicles and places
  - { lemma: buss,      pos: noun, gender: en,  tags: [vehicle], level: A1, gloss: bus }
  - { lemma: tåg,       pos: noun, gender: ett, tags: [vehicle], level: A1, gloss: train }
  - { lemma: spårvagn,  pos: noun, gender: en,  tags: [vehicle], level: A1, gloss: tram }
  - { lemma: hållplats, pos: noun, gender: en,  tags: [place],   level: A1, gloss: "stop (bus or tram)" }
  - { lemma: station,   pos: noun, gender: en,  tags: [place],   level: A1, gloss: station }
  - { lemma: spår,      pos: noun, gender: ett, level: A1, gloss: "platform, track" }
  - { lemma: biljett,   pos: noun, gender: en,  tags: [document], level: A1, gloss: ticket }

  # verbs
  - { lemma: gå,    pos: verb, tags: [action_intrans], level: A1, gloss: "to go, to leave; past: went; pp: gone" }
  - { lemma: åka,   pos: verb, tags: [action_intrans], level: A1, gloss: "to go (by bus, train, car); past: went; pp: gone" }
  - { lemma: byta,  pos: verb, level: A1, gloss: to change }
  - { lemma: vänta, pos: verb, tags: [action_intrans], level: A1, gloss: to wait }

  # time
  - { lemma: klocka, pos: noun, gender: en, level: A1, gloss: "clock (klockan 3 = at 3 o'clock)" }
  - { lemma: minut,  pos: noun, gender: en, tags: [time_unit], level: A1, gloss: minute, forms: { pl: minuter } }
  - { lemma: halv,   pos: adj,  level: A1, gloss: "half (halv 4 = 3.30)" }
  - { lemma: kvart,  pos: noun, gender: en, level: A1, gloss: "quarter (kvart över 3 = 3.15)", forms: { pl: kvartar } }
  - { lemma: över,   pos: prep, level: A1, gloss: "past (5 över 3 = 3.05)" }
  - { lemma: nästa,  pos: adj,  level: A1, gloss: next }


  # A2: delays and announcements
  - { lemma: försenad,    pos: adj,  level: A2, gloss: "delayed, late" }
  - { lemma: inställd,    pos: adj,  level: A2, gloss: cancelled }
  - { lemma: avgång,      pos: noun, gender: en,  level: A2, gloss: departure }
  - { lemma: problem,     pos: noun, gender: ett, tags: [problem], level: A2, gloss: problem }
  - { lemma: information, pos: noun, gender: en,  level: A2, gloss: information }
  - { lemma: hinna,       pos: verb, level: A2, gloss: "to make it, to have time; past: made it; pp: made it" }
  - { lemma: missa,       pos: verb, level: A2, gloss: to miss }
  - { lemma: stanna,      pos: verb, tags: [action_intrans], level: A2, gloss: "to stop, to stay; past: stopped; pp: stopped" }
  - { lemma: resa,        pos: verb, tags: [action_intrans], level: A2, gloss: "to travel; past: travelled; pp: travelled" }


  # B1: booking a trip
  - { lemma: hotell,      pos: noun, gender: ett, tags: [place], level: B1, gloss: hotel }
  - { lemma: flyg,        pos: noun, gender: ett, tags: [vehicle], level: B1, gloss: "flight, plane" }
  - { lemma: flygplats,   pos: noun, gender: en,  tags: [place], level: B1, gloss: airport }
  - { lemma: pass,        pos: noun, gender: ett, tags: [document], level: B1, gloss: passport }
  - { lemma: bagage,      pos: noun, gender: ett, level: B1, gloss: luggage }
  - { lemma: väska,       pos: noun, gender: en,  tags: [container], level: B1, gloss: bag }
  - { lemma: försäkring,  pos: noun, gender: en,  level: B1, gloss: insurance }
  - { lemma: turist,      pos: noun, gender: en,  level: B1, gloss: tourist }
  - { lemma: karta,       pos: noun, gender: en,  tags: [document], level: B1, gloss: map }
  - { lemma: centrum,     pos: noun, gender: ett, level: B1, gloss: "town centre", forms: { def: centrum, pl: centrum } }
  - { lemma: bekräftelse, pos: noun, gender: en,  tags: [document], level: B1, gloss: confirmation }
  - { lemma: avboka,      pos: verb, level: B1, gloss: "to cancel (a booking)" }
  - { lemma: ingå,        pos: verb, level: B1, gloss: "to be included" }
  - { lemma: landa,       pos: verb, level: B1, gloss: to land }
  - { lemma: utomlands,   pos: adv,  level: B1, gloss: abroad }
  - { lemma: möjlig,      pos: adj,  level: B1, gloss: possible }
  - { lemma: extra,       pos: adj,  level: B1, gloss: extra }
  # B2: when the trip goes wrong
  - { lemma: anslutning,     pos: noun, gender: en,  level: B2, gloss: connection }
  - { lemma: försening,      pos: noun, gender: en,  level: B2, gloss: delay }
  - { lemma: resenär,        pos: noun, gender: en,  level: B2, gloss: "traveller, passenger" }
  - { lemma: incheckning,    pos: noun, gender: en,  level: B2, gloss: check-in }
  - { lemma: kontroll,       pos: noun, gender: en,  level: B2, gloss: "check, control" }
  - { lemma: mellanlandning, pos: noun, gender: en,  level: B2, gloss: stopover }
  - { lemma: ankomst,        pos: noun, gender: en,  level: B2, gloss: arrival }
  - { lemma: avresa,         pos: noun, gender: en,  level: B2, gloss: departure }
  - { lemma: orsaka,         pos: verb, level: B2, gloss: "to cause" }
  - { lemma: rimlig,         pos: adj,  level: B2, gloss: reasonable }
  - { lemma: nödvändig,      pos: adj,  level: B2, gloss: necessary }
  - { lemma: tur,            pos: noun, gender: en,  level: B2, gloss: "luck, trip, turn" }
  - { lemma: otur,           pos: noun, gender: en,  level: B2, gloss: "bad luck" }
  - { lemma: situation,      pos: noun, gender: en,  level: B2, gloss: situation }
  - { lemma: lösning,        pos: noun, gender: en,  level: B2, gloss: solution }
  - { lemma: lösa,           pos: verb, level: B2, gloss: "to solve" }
  - { lemma: alternativ,     pos: noun, gender: ett, level: B2, gloss: alternative }
  - { lemma: blankett,       pos: noun, gender: en,  level: B2, gloss: form }
  - { lemma: ansöka,         pos: verb, level: B2, gloss: "ansöka om = to apply for" }
  - { lemma: strejk,         pos: noun, gender: en,  level: B2, gloss: strike }

frames:
  - { id: res-01, level: A1, grammar: [wh_question, def_singular], review: true,
      sv: "När går {vehicle.def}?", en: "When does the {1} leave?" }
  - { id: res-02, level: A1, grammar: [present_tense, def_singular], review: true,
      sv: "Jag tar {vehicle.def} till {place.def}.", en: "I take the {1} to the {2}." }
  - { id: res-03, level: A1, grammar: [v2_word_order, def_singular], review: true,
      sv: "Nu går {vehicle.def}.", en: "The {1} is leaving now." }
  - { id: res-04, level: A1, grammar: [present_tense, def_singular], review: true,
      sv: "Jag väntar på {vehicle.def}.", en: "I am waiting for the {1}." }
  - { id: res-05, level: A1, grammar: [yes_no_question, def_singular], review: true,
      sv: "Går {vehicle.def} till {place.def}?", en: "Does the {1} go to the {2}?" }
