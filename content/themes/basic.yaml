theme: basic
title: "Grundord"
# Pronouns, common verbs and function words that every theme needs.
# The fixed words of the generic frames (content/frames.yaml) must be in this pack.
# forms: pins the usual form where SALDO also lists an old or unrelated one (haver, skall, varar).
words:
  # pronouns
  - { lemma: jag, pos: pron, level: A1, gloss: I }
  - { lemma: du,  pos: pron, level: A1, gloss: you (one person) }
  - { lemma: han, pos: pron, level: A1, gloss: he }
  - { lemma: hon, pos: pron, level: A1, gloss: she }
  - { lemma: vi,  pos: pron, level: A1, gloss: we }
  - { lemma: ni,  pos: pron, level: A1, gloss: you (several people) }
  - { lemma: de,  pos: pron, level: A1, gloss: they }
  - { lemma: den, pos: pron, level: A1, gloss: "it (den for en-words, det for ett-words)" }
  - { lemma: min,    pos: pron, level: A1, gloss: "my (min, mitt, mina)" }
  - { lemma: din,    pos: pron, level: A1, gloss: "your (din, ditt, dina)" }
  - { lemma: hans,   pos: pron, level: A1, gloss: his }
  - { lemma: hennes, pos: pron, level: A1, gloss: her }

  # common verbs
  - { lemma: vara,   pos: verb, level: A1, gloss: "to be; past: was; pp: been",
      forms: { pres: är, past: var, sup: varit } }
  - { lemma: ha,     pos: verb, level: A1, gloss: "to have; past: had; pp: had", forms: { pres: har } }
  - { lemma: behöva, pos: verb, level: A1, gloss: to need }
  - { lemma: ta,     pos: verb, tags: [action_object], level: A1, gloss: "to take; past: took; pp: taken",
      forms: { inf: ta, pres: tar } }
  - { lemma: vilja,  pos: verb, level: A1, gloss: to want }
  - { lemma: kunna,  pos: verb, level: A1, gloss: "can, to be able to" }
  - { lemma: skola,  pos: verb, level: A1, gloss: "shall, to be going to (ska)", forms: { pres: ska } }
  - { lemma: måste,  pos: verb, level: A1, gloss: "must, to have to", forms: { pres: måste } }

  # question words
  - { lemma: vad,      pos: pron, level: A1, gloss: what }
  - { lemma: var,      pos: adv,  level: A1, gloss: where }
  - { lemma: varifrån, pos: adv,  level: A1, gloss: where from }
  - { lemma: hur,      pos: adv,  level: A1, gloss: how }
  - { lemma: när,      pos: adv,  level: A1, gloss: when }
  - { lemma: vem,      pos: pron, level: A1, gloss: who }

  # small words
  - { lemma: en,     pos: article, level: A1, gloss: "a, an (en or ett)" }
  - { lemma: och,    pos: conj,    level: A1, gloss: and }
  - { lemma: men,    pos: conj,    level: A1, gloss: but }
  - { lemma: inte,   pos: adv,     level: A1, gloss: not }
  - { lemma: också,  pos: adv,     level: A1, gloss: "also, too" }
  - { lemma: kanske, pos: adv,     level: A1, gloss: maybe }
  - { lemma: gärna,  pos: adv,     level: A1, gloss: "gladly (ja, gärna = yes, I'd love to)" }
  - { lemma: många,  pos: pron,    level: A1, gloss: many }
  - { lemma: som,    pos: adv,     level: A1, gloss: "as (jobba som = work as)" }
  - { lemma: redan,  pos: adv,     level: A2, gloss: already }

  # A2
  - { lemma: att,      pos: subj, level: A2, gloss: "that; to (before a verb)" }
  - { lemma: eftersom, pos: subj, level: A2, gloss: because }
  - { lemma: varför,   pos: adv,  level: A2, gloss: why }
  - { lemma: än,       pos: adv,  level: A2, gloss: "than (billigare än); yet (inte än = not yet)" }
  - { lemma: av,       pos: prep, level: A2, gloss: "of, by" }
  - { lemma: sig,      pos: pron, level: A2, gloss: "himself, herself, themselves" }
  - { lemma: all,      pos: pron, level: A2, gloss: "all (all, allt, alla)" }
  - { lemma: vilken,   pos: pron, level: A2, gloss: "which (vilken, vilket, vilka)" }
  - { lemma: bli,      pos: verb, level: A2, gloss: "to become, to be; past: became; pp: become",
      forms: { pres: blir, imp: bli } }
  - { lemma: få,       pos: verb, level: A2, gloss: "to get, to be allowed to; past: got; pp: got" }
  - { lemma: ge,       pos: verb, level: A2, gloss: "to give; past: gave; pp: given", forms: { inf: ge, pres: ger, sup: gett, imp: ge } }
  - { lemma: säga,     pos: verb, level: A2, gloss: "to say; past: said; pp: said",
      forms: { pres: säger, past: sa, imp: säg } }
  - { lemma: tro,      pos: verb, level: A2, gloss: "to think, to believe; past: thought; pp: thought" }
  - { lemma: tycka,    pos: verb, level: A2, gloss: "to think (have an opinion); past: thought; pp: thought" }
  - { lemma: veta,     pos: verb, level: A2, gloss: "to know; past: knew; pp: known" }
  - { lemma: fråga,    pos: verb, level: A2, gloss: to ask }
  - { lemma: svara,    pos: verb, level: A2, gloss: to answer }
  - { lemma: skriva,   pos: verb, level: A2, gloss: "to write; past: wrote; pp: written" }
  - { lemma: ringa,    pos: verb, level: A2, gloss: "to call, to phone; past: called; pp: called",
      forms: { pres: ringer, past: ringde, sup: ringt, imp: ring } }
  - { lemma: använda,  pos: verb, level: A2, gloss: "to use" }
  - { lemma: glömma,   pos: verb, level: A2, gloss: "to forget; past: forgot; pp: forgotten" }
  - { lemma: bruka,    pos: verb, level: A2, gloss: "to usually do (jag brukar … = I usually …)" }
  - { lemma: mycket,   pos: adv,  level: A2, gloss: "much, a lot, very" }
  - { lemma: lite,     pos: adv,  level: A2, gloss: "a little" }
  - { lemma: här,      pos: adv,  level: A2, gloss: here }
  - { lemma: hit,      pos: adv,  level: A2, gloss: "here (to this place)" }
  - { lemma: upp,      pos: adv,  level: A2, gloss: up }
  - { lemma: inne,     pos: adv,  level: A2, gloss: "inside, indoors" }
  - { lemma: ute,      pos: adv,  level: A2, gloss: "outside, outdoors" }
  - { lemma: fram,     pos: adv,  level: A2, gloss: "forward (komma fram = arrive)" }
  - { lemma: tillbaka, pos: adv,  level: A2, gloss: back }
  - { lemma: sönder,   pos: adv,  level: A2, gloss: "broken (gå sönder = break)" }
  - { lemma: istället, pos: adv,  level: A2, gloss: instead }
  - { lemma: tyvärr,   pos: adv,  level: A2, gloss: unfortunately }
  - { lemma: ungefär,  pos: adv,  level: A2, gloss: "about, roughly" }
  - { lemma: igår,     pos: adv,  level: A2, gloss: yesterday }
  - { lemma: förra,    pos: adj,  level: A2, gloss: "last (förra veckan = last week)" }
  - { lemma: först,    pos: adv,  level: A2, gloss: first }
  - { lemma: efter,    pos: prep, level: A2, gloss: after }
  - { lemma: innan,    pos: prep, level: A2, gloss: before }
  - { lemma: länge,    pos: adv,  level: A2, gloss: "for a long time" }
  - { lemma: snart,    pos: adv,  level: A2, gloss: soon }
  - { lemma: igen,     pos: adv,  level: A2, gloss: again }
  - { lemma: alltid,   pos: adv,  level: A2, gloss: always }
  - { lemma: ofta,     pos: adv,  level: A2, gloss: often }
  - { lemma: ibland,   pos: adv,  level: A2, gloss: sometimes }
  - { lemma: aldrig,   pos: adv,  level: A2, gloss: never }
  - { lemma: tidig,    pos: adj,  level: A2, gloss: early }
  - { lemma: sen,      pos: adj,  level: A2, gloss: late }
  - { lemma: klar,     pos: adj,  level: A2, gloss: "ready, done" }

  # place and direction
  - { lemma: i,    pos: prep, level: A1, gloss: in }
  - { lemma: på,   pos: prep, level: A1, gloss: "on, at" }
  - { lemma: från, pos: prep, level: A1, gloss: from }
  - { lemma: till, pos: prep, level: A1, gloss: to }
  - { lemma: med,  pos: prep, level: A1, gloss: with }
  - { lemma: vid,  pos: prep, level: A1, gloss: "at, by" }
  - { lemma: för,  pos: prep, level: A1, gloss: "for (vad har du för …? = what … do you have?)" }
  - { lemma: där,  pos: adv,  level: A1, gloss: there }

  # time
  - { lemma: nu,      pos: adv,  level: A1, gloss: now }
  - { lemma: idag,    pos: adv,  level: A1, gloss: today }
  - { lemma: imorgon, pos: adv,  level: A1, gloss: tomorrow }
  - { lemma: ikväll,  pos: adv,  level: A1, gloss: "tonight, this evening" }
  - { lemma: sedan,   pos: adv,  level: A1, gloss: "then, after that" }
  - { lemma: då,      pos: adv,  level: A1, gloss: "then (hej då = goodbye)" }
  - { lemma: om,      pos: prep, level: A1, gloss: "in (om 5 minuter = in 5 minutes)" }

  # greetings, answers, common adjectives
  - { lemma: hej,  pos: interj, level: A1, gloss: hi }
  - { lemma: tack, pos: interj, level: A1, gloss: thanks }
  - { lemma: ja,   pos: interj, level: A1, gloss: "yes" }
  - { lemma: nej,  pos: interj, level: A1, gloss: "no" }
  - { lemma: bra,     pos: adj, level: A1, gloss: "good, well" }
  - { lemma: gammal,  pos: adj, tags: [state], level: A1, gloss: old }
  - { lemma: ny,      pos: adj, tags: [state], level: A1, gloss: new }
  - { lemma: stor,    pos: adj, tags: [state], level: A1, gloss: big }
  - { lemma: liten,   pos: adj, tags: [state], level: A1, gloss: small }
