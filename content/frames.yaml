# Generic sentence frames, usable with any theme.
# Slot: {tags.form} or {tag~N} (adjective agreeing with slot N). Fixed words must be in
# the basic pack. Every frame keeps review: true until Themis has checked it.

# ---- A1 ----
- { id: gen-001, level: A1, grammar: [wh_question, def_singular], review: true,
    sv: "Var är {tool|container|device|document|food|drink.def}?", en: "Where is the {1}?" }

- { id: gen-002, level: A1, grammar: [yes_no_question, en_ett], review: true,
    sv: "Har du {tool|container|device|document.a}?", en: "Do you have {1.a}?" }

- { id: gen-003, level: A1, grammar: [adjective_agreement_basic, def_singular], review: true,
    sv: "{tool|device|furniture|container|surface.def} är {state~1}.", en: "The {1} is {2}." }

- { id: gen-004, level: A1, grammar: [negation_inte, def_singular], review: true,
